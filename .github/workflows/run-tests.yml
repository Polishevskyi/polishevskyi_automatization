name: Automated tests with Allure

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Choose target
        required: true
        default: All_Tests
        type: choice
        options:
          - All_Tests
          - Ain_UI_Tests
          - Citrus_UI_Tests
          - Study_API_Tests
          - Reqres_API_Test

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  Testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Allure
        run: sudo wget https://github.com/allure-framework/allure2/releases/download/2.23.1/allure-2.23.1.tgz && sudo tar -zxvf allure-2.23.1.tgz -C /opt/ && sudo ln -s /opt/allure-2.23.1/bin/allure /usr/bin/allure

      - name: Run All_Tests
        if: "github.event.inputs.deployment_target == 'All_Tests'"
        run: ./gradlew test -PallureReportDir=allure-results

      - name: Run Ain_UI_Tests
        if: "github.event.inputs.deployment_target == 'Ain_UI_Tests'"
        run: ./gradlew test --tests web.ain.AinTests -PallureReportDir=allure-results

      - name: Run Citrus_UI_Tests
        if: "github.event.inputs.deployment_target == 'Citrus_UI_Tests'"
        run: ./gradlew test --tests web.ain.CitrusTests -PallureReportDir=allure-results

      - name: Run Study_API_Tests
        if: "github.event.inputs.deployment_target == 'Study_API_Tests'"
        run: ./gradlew test --tests api.forstudy.ForStudyApiTests -PallureReportDir=allure-results

      - name: Run Reqres_API_Test
        if: "github.event.inputs.deployment_target == 'Reqres_API_Test'"
        run: ./gradlew test --tests api.reqres.ForStudyApiTests -PallureReportDir=allure-results

      - name: Store Allure Results
        uses: actions/upload-artifact@v3
        with:
          name: allure-results
          path: allure-results
          retention-days: 1

  Generate-Report:
    runs-on: ubuntu-latest
    needs: Testing
    name: Generate Allure Report

    steps:
      - name: Download Allure Results
        uses: actions/download-artifact@v3
        with:
          name: allure-results

      - name: Generate Allure Report
        run: allure generate -c allure-results -o allure-report

      - name: Store Allure Report
        uses: actions/upload-artifact@v3
        with:
          name: allure-report
          path: build/allure-results
          retention-days: 1

  Publish-Report:
    runs-on: ubuntu-latest
    needs: Generate-Report
    name: Publish Allure Report

    steps:
      - name: Download Allure Report
        uses: actions/download-artifact@v3
        with:
          name: allure-report

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1.2.9
