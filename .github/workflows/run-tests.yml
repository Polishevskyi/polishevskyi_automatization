name: Automated tests

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Choose target
        required: true
        default: All_Tests
        type: choice
        options:
          - All_Tests
          - Ain_UI_Tests
          - Citrus_UI_Tests
          - Study_API_Tests
          - Reqres_API_Test

jobs:
  Testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

#      - name: Cache Gradle dependencies
#        uses: actions/cache@v3
#        with:
#          path: ~/.gradle/caches
#          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
#          restore-keys: |
#            ${{ runner.os }}-gradle-

      - name: Run selected tests
        run: |
          if [ "${{ github.event.inputs.deployment_target }}" == "All_Tests" ]; then
            ./gradlew test
          elif [ "${{ github.event.inputs.deployment_target }}" == "Ain_UI_Tests" ]; then
            ./gradlew test --tests web.ain.AinTests
          elif [ "${{ github.event.inputs.deployment_target }}" == "Citrus_UI_Tests" ]; then
            ./gradlew test --tests web.ain.CitrusTests
          elif [ "${{ github.event.inputs.deployment_target }}" == "Study_API_Tests" ]; then
            ./gradlew test --tests api.forstudy.ForStudyApiTests
          elif [ "${{ github.event.inputs.deployment_target }}" == "Reqres_API_Test" ]; then
            ./gradlew test --tests api.reqres.ForStudyApiTests 
          fi